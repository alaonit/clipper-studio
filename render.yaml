services:
  - type: web
    name: clipper-studio-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ALLOW_URL_DOWNLOAD
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
