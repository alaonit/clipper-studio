services:
  - type: web
    name: clipper-studio-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ALLOW_URL_DOWNLOAD
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
